name: fx

x-neo4j-image: &neo4j-image neo4j:5.25.1-community@sha256:ca5da0c4cb596a9e9097aad8c79c10156f0c6261faa2ddcc74183a1e552554ed

services:
  material-init:
    image: *neo4j-image
    entrypoint: ["/bin/bash", "/tools/restore-snapshot.sh"]
    volumes:
      - material-data:/data
      - ./database/snapshots/material:/snapshots:ro
      - ./database/restore-snapshot.sh:/tools/restore-snapshot.sh:ro
  standard-init:
    image: *neo4j-image
    entrypoint: ["/bin/bash", "/tools/restore-snapshot.sh"]
    volumes:
      - standard-data:/data
      - ./database/snapshots/standard:/snapshots:ro
      - ./database/restore-snapshot.sh:/tools/restore-snapshot.sh:ro

  material:
    image: *neo4j-image
    depends_on:
      material-init: {condition: service_completed_successfully}
    environment:
      NEO4J_AUTH: neo4j/${FX_NEO4J_PASSWORD:?Copy .env.example to .env and set a password}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes: [material-data:/data]
    ports: ["127.0.0.1:${FX_MATERIAL_BOLT_PORT:-17687}:7687"]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
  standard:
    image: *neo4j-image
    depends_on:
      standard-init: {condition: service_completed_successfully}
    environment:
      NEO4J_AUTH: neo4j/${FX_STANDARD_PASSWORD:?Copy .env.example to .env and set a password}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes: [standard-data:/data]
    ports: ["127.0.0.1:${FX_STANDARD_BOLT_PORT:-17689}:7687"]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  server:
    build: {context: ., dockerfile: server/Dockerfile}
    depends_on:
      material: {condition: service_healthy}
      standard: {condition: service_healthy}
    environment:
      PORT: 3001
      NEO4J_URI: bolt://material:7687
      NEO4J_USER: neo4j
      NEO4J_PASS: ${FX_NEO4J_PASSWORD:?Set FX_NEO4J_PASSWORD}
      NEO4J_STANDARD_URI: bolt://standard:7687
      NEO4J_STANDARD_USER: neo4j
      NEO4J_STANDARD_PASS: ${FX_STANDARD_PASSWORD:?Set FX_STANDARD_PASSWORD}
    ports: ["127.0.0.1:${FX_API_PORT:-13001}:3001"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(async r=>{if(!r.ok || !(await r.json()).ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build: {context: ., dockerfile: web/Dockerfile}
    depends_on:
      server: {condition: service_healthy}
    ports: ["127.0.0.1:${FX_WEB_PORT:-8080}:80"]

volumes:
  material-data:
  standard-data:
