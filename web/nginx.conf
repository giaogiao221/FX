server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        proxy_pass http://server:3001/;
        proxy_read_timeout 240s;
    }
    location /structures/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
